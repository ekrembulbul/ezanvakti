services:
  vakit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VAKIT_VERSION:-dev}
    image: vakit-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3060:8080"
    env_file:
      - vakit.env
    environment:
      VAKIT_DATA_DIR: /data
      VAKIT_ADDR: 0.0.0.0:8080
    volumes:
      - ./data:/data
    command: ["serve"]
