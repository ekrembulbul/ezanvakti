name: iOS TestFlight

# vX.Y.Z (iki platform) veya ios-vX.Y.Z (sadece iOS) tag'inde calisir; IPA derleyip
# TestFlight'a yukler. android-v* tag'i bu workflow'u tetiklemez.
on:
  push:
    tags:
      - 'v*'
      - 'ios-v*'
  # Tag yakmadan elle test/yeniden deneme icin (Actions > Run workflow)
  workflow_dispatch:

# Action'lar tam commit SHA'sıyla sabit (etiket taşınsa da kod değişmez); güncellemek
# için yeni sürümün SHA'sını yaz. GITHUB_TOKEN yalnız okur; checkout token'ı .git'e bırakmaz.
permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Xcode 26 sec (Apple iOS 26 SDK zorunlulugu)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Flutter kurulumu
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Bagimliliklar (SPM kapali; flutter_local_notifications uyumu)
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Sunucu adresi (VAKIT_API_BASE_URL) tanimli mi
        env:
          VAKIT_API_BASE_URL: ${{ vars.VAKIT_API_BASE_URL }}
        run: |
          if [ -z "$VAKIT_API_BASE_URL" ]; then
            echo "HATA: repository variable VAKIT_API_BASE_URL tanimli degil (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi

      - name: iOS projesini hazirla (configs + pod install)
        # --config-only DART_DEFINES'i Generated.xcconfig'e yazar; sonraki xcodebuild bunu kullanir.
        run: flutter build ios --config-only --release --no-codesign --dart-define=VAKIT_API_BASE_URL=${{ vars.VAKIT_API_BASE_URL }}

      - name: Dagitim sertifikasini dosyaya yaz
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
        run: echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist_cert.p12"

      - name: Provisioning profile'lari kur (uygulama + widget)
        env:
          PROFILE_B64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          WIDGET_PROFILE_B64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          # Eksik secret'ta sessizce devam etmek, build'in sonunda anlasilmasi
          # zor bir imza hatasina donusuyor; hemen duruyoruz.
          install_profile() {
            local b64="$1" name="$2"
            if [ -z "$b64" ]; then
              echo "HATA: $name profili icin secret tanimli degil" >&2
              exit 1
            fi
            echo "$b64" | base64 --decode > "$RUNNER_TEMP/$name.mobileprovision"
            UUID=$(security cms -D -i "$RUNNER_TEMP/$name.mobileprovision" | plutil -extract UUID raw -)
            cp "$RUNNER_TEMP/$name.mobileprovision" "$PROFILES_DIR/$UUID.mobileprovision"
            echo "$name profili kuruldu (UUID: $UUID)"
          }

          install_profile "$PROFILE_B64" appstore
          install_profile "$WIDGET_PROFILE_B64" widget

      - name: TestFlight'a derle ve yukle (fastlane)
        working-directory: ios
        env:
          CERT_PATH: ${{ runner.temp }}/dist_cert.p12
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Gemfile.lock dışına çıkılmaz: alt bağımlılıklar her koşuda yeniden çözülmez.
          BUNDLE_FROZEN: "true"
        run: |
          bundle install
          bundle exec fastlane beta
