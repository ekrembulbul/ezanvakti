name: server-ci

# main'de aynı kontroller server-deploy workflow'unun test job'unda koşar.
on:
  push:
    branches: ["dev", "feature/**"]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

# Action'lar tam commit SHA'sıyla sabit (etiket taşınsa da kod değişmez); güncellemek
# için yeni sürümün SHA'sını yaz. GITHUB_TOKEN yalnız okur; checkout token'ı .git'e bırakmaz.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Docker build
        run: docker build -f deploy/Dockerfile -t vakit-api:ci .
