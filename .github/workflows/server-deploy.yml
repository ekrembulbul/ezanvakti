name: server-deploy

# main'e server/ değişikliği gelince: test → GHCR imajı → SSH ile sunucuya dağıtım.
# Secrets (Settings → Secrets and variables → Actions):
#   SERVER_HOST, SERVER_SSH_KEY, SERVER_KNOWN_HOSTS, AWQAT_EMAIL, AWQAT_PASSWORD
# Repo public, Actions logları herkese açık: sunucu adresi bu yüzden secret'ta.
# Sunucu düzeni ve elle işlemler: server/README.md "Dağıtım".

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vakit-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: server
          file: server/deploy/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/vakit-api:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/deploy

      - name: SSH ayarı
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          for v in SERVER_HOST SERVER_SSH_KEY SERVER_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "HATA: $v secret'ı tanımlı değil" >&2; exit 1; }
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "Host vakit" "  HostName $SERVER_HOST" "  User ezanvakti" \
            "  IdentityFile ~/.ssh/deploy_key" "  IdentitiesOnly yes" \
            "  StrictHostKeyChecking yes" "  BatchMode yes" > ~/.ssh/config

      - name: Dosyalar
        run: |
          tar -C server/deploy -cf - compose.prod.yml crontab | ssh vakit '
            set -eu
            install -d -m 750 ~/vakit-api ~/vakit-api/data ~/vakit-api/logs
            tar -C ~/vakit-api -xf -
            mv ~/vakit-api/compose.prod.yml ~/vakit-api/compose.yml'

      - name: vakit.env (secret'lardan)
        env:
          AWQAT_EMAIL: ${{ secrets.AWQAT_EMAIL }}
          AWQAT_PASSWORD: ${{ secrets.AWQAT_PASSWORD }}
        run: |
          [ -n "$AWQAT_EMAIL" ] && [ -n "$AWQAT_PASSWORD" ] || { echo "HATA: AWQAT_EMAIL/AWQAT_PASSWORD secret'ı boş" >&2; exit 1; }
          case "$AWQAT_EMAIL$AWQAT_PASSWORD" in
            *"'"*|*$'\n'*) echo "HATA: kimlik bilgisi tek tırnak ya da satır sonu içeremez" >&2; exit 1 ;;
          esac
          # Tek tırnak: compose env dosyasında $ işaretini değişken saymasın.
          printf "AWQAT_EMAIL='%s'\nAWQAT_PASSWORD='%s'\n" "$AWQAT_EMAIL" "$AWQAT_PASSWORD" |
            ssh vakit 'umask 077 && cat > ~/vakit-api/vakit.env.new && mv ~/vakit-api/vakit.env.new ~/vakit-api/vakit.env'

      - name: Dağıt
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # $GHCR_USER ve $IMAGE_REF bilerek runner'da açılır; id -u/-g sunucuda.
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh vakit "docker login ghcr.io -u '$GHCR_USER' --password-stdin > /dev/null"
          # shellcheck disable=SC2029
          ssh vakit "set -eu
            cd ~/vakit-api
            printf 'VAKIT_IMAGE=%s\nVAKIT_UID=%s\nVAKIT_GID=%s\n' '$IMAGE_REF' \"\$(id -u)\" \"\$(id -g)\" > .env
            docker compose pull --quiet
            docker logout ghcr.io > /dev/null
            docker compose up -d --remove-orphans
            crontab crontab
            docker image prune -af --filter 'label=org.opencontainers.image.source=https://github.com/${{ github.repository }}' --filter 'until=240h' > /dev/null"

      - name: Sağlık kontrolü
        run: |
          ssh vakit 'for i in $(seq 1 30); do
              curl -fsS -o /dev/null http://127.0.0.1:3060/v1/health && echo "yerel: 200" && exit 0
              sleep 1
            done
            docker compose -f ~/vakit-api/compose.yml logs --tail 50 vakit; exit 1'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 --retry-all-errors \
            https://ezanvakti.ekrembulbul.me/v1/health || true)
          echo "https://ezanvakti.ekrembulbul.me/v1/health: $code"
          # Tünel/Cloudflare sorunu dağıtımı geri almaz; uyarı olarak görünür.
          [ "$code" = 200 ] || echo "::warning::Dış adres $code döndü; tünel ve Cloudflare ayarlarını kontrol et."

      - name: SSH anahtarını sil
        if: always()
        run: rm -f ~/.ssh/deploy_key
