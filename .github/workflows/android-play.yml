name: Android Play (internal)

# Tek sürüm/tek tag: vX.Y.Z tag'i hem iOS hem Android'i tetikler (beraber versiyonlama).
# Play secret'lari henuz yoksa Android isi ATLANIR (skip), iOS tag'leri hata vermez.
# Secret'lar eklenince otomatik calismaya baslar.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'android-v*'

# Action'lar tam commit SHA'sıyla sabit (etiket taşınsa da kod değişmez); güncellemek
# için yeni sürümün SHA'sını yaz. GITHUB_TOKEN yalnız okur; checkout token'ı .git'e bırakmaz.
permissions:
  contents: read

jobs:
  # Gerekli Play secret'lari var mi? Yoksa internal job atlanir (kirmizi olmaz).
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - id: c
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Play secret'lari (PLAY_SERVICE_ACCOUNT_JSON_BASE64 / ANDROID_KEYSTORE_BASE64) tanimli degil; Android yuklemesi atlandi."
          fi

  internal:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Java kurulumu
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter kurulumu
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: Upload keystore'u ve key.properties'i yaz
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/upload.jks
          EOF

      - name: Sunucu adresi (VAKIT_API_BASE_URL) tanimli mi
        env:
          VAKIT_API_BASE_URL: ${{ vars.VAKIT_API_BASE_URL }}
        run: |
          if [ -z "$VAKIT_API_BASE_URL" ]; then
            echo "HATA: repository variable VAKIT_API_BASE_URL tanimli degil (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi

      - name: AAB derle (imzali release)
        run: flutter build appbundle --release --dart-define=VAKIT_API_BASE_URL=${{ vars.VAKIT_API_BASE_URL }}

      - name: Play service account anahtarini yaz
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: echo "$PLAY_JSON_B64" | base64 --decode > "$RUNNER_TEMP/play.json"

      - name: Play internal testing'e yukle (fastlane supply)
        working-directory: android
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play.json
          # Gemfile.lock dışına çıkılmaz: alt bağımlılıklar her koşuda yeniden çözülmez.
          BUNDLE_FROZEN: "true"
        run: |
          bundle install
          bundle exec fastlane internal
